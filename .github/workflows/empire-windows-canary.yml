name: Empire Windows Canary

# Fork-eigenes CI-Gate (buzz#48).
#
# Warum eine zweite Datei neben .github/workflows/windows-canary.yml:
# Der Upstream-Canary traegt `if: github.repository == 'block/buzz'` und wird
# auf jedem Fork komplett uebersprungen — ein Dispatch dort meldet "success",
# ohne eine einzige Zeile gebaut zu haben. Diese Datei ist das Fork-Pendant und
# spiegelt bewusst nur den Trigger + die Guards, nicht die Build-Logik.
#
# Was der Canary beweist:  der Fork-Code baut auf Windows und liefert einen
#                          NSIS-Installer.
# Was er NICHT beweist:    dass er auf Munirs Maschine baut. Der Runner bekommt
#                          Hermit funktionierend, lokal ist Hermit inert
#                          (.empire/BUILD.md). Der Canary ersetzt BUILD.md nicht.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Fork-Doku und .empire/-Werkzeuge fassen den Rust-/Desktop-Build nicht an.
    # Ohne diese Liste kostet jeder Doku-PR 45+ Windows-Minuten.
    paths-ignore:
      - '.empire/**'
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

# In einer Agenten-Welle laufen mehrere Merges kurz hintereinander auf main.
# Nur der juengste Stand ist interessant.
concurrency:
  group: empire-windows-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows canary (fork)
    # Inert, falls diese Datei je upstream landet.
    if: github.repository == 'munirad7s/buzz'
    runs-on: windows-latest
    # Upstream steht auf 60 min mit warmem Shared-Cache. Der erste Fork-Lauf ist
    # kalt; 60 min waeren ein falsches Rot.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      # Bewusst KEIN "Require main" wie upstream: der Canary ist auf dem Fork
      # gerade dann wertvoll, wenn er einen Upstream-Merge-Branch VOR dem Merge
      # prueft. push-Trigger bleibt trotzdem auf main beschraenkt.
      - name: Report source ref
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
        run: echo "Canary baut aus $SOURCE_REF ($GITHUB_SHA)"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          shared-key: empire-windows-canary-release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Derive canary version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./desktop/package.json').version")
          if ! [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version '$BASE_VERSION' is not semver"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-empire.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building canary version $VERSION from $GITHUB_SHA"

      - name: Patch canary version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.canary.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build Windows NSIS installer (unsigned)
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.canary.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Locate NSIS installer
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"
          EXE=$(find "$BUNDLE_DIR/nsis" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR/nsis"
            exit 1
          fi
          BYTES=$(wc -c < "$EXE")
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "Installer: $(basename "$EXE") — $BYTES bytes"
          {
            echo "### Windows-Canary-Artefakt"
            echo ""
            echo "- Datei: \`$(basename "$EXE")\`"
            echo "- Groesse: $BYTES bytes"
            echo "- Quelle: \`${GITHUB_REF}\` @ \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Windows canary installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-windows-canary-${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.artifact.outputs.exe }}
          if-no-files-found: error
          retention-days: 7

      - name: Save pnpm store cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
